name: Publish Foundation CLI

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: foundation-cli-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'cli-v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: foundation-ci-only
          POSTGRES_DB: foundation_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U foundation -d foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://foundation:foundation-ci-only@127.0.0.1:5432/foundation_test
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Plan the release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node .github/scripts/cli-release.mjs plan
      - name: Install test dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Check and test
        run: |
          npm run check
          npm test
          npm run build
      - name: Test browser workflows
        run: |
          python3 -m venv "$RUNNER_TEMP/foundation-ui"
          "$RUNNER_TEMP/foundation-ui/bin/pip" install playwright==1.58.0
          "$RUNNER_TEMP/foundation-ui/bin/python" -m playwright install --with-deps chromium webkit
          "$RUNNER_TEMP/foundation-ui/bin/python" tests/browser.py
      - name: Pack and check the distributable
        id: package
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join, basename } from 'node:path';
          const pkg = JSON.parse(readFileSync('cli/package.json', 'utf8'));
          const [packed] = JSON.parse(execFileSync('npm', ['pack', '--json', '--ignore-scripts', '--pack-destination', process.env.RUNNER_TEMP, './cli'], { encoding: 'utf8' }));
          const allowed = new Set(['package.json', 'LICENSE', ...pkg.files]);
          if (!packed.files.every(file => allowed.has(file.path))) throw new Error('The package contains files outside the CLI distribution.');
          if (!packed.files.some(file => file.path === 'LICENSE')) throw new Error('The package must include its license.');
          if (packed.filename !== basename(packed.filename)) throw new Error('Unexpected package filename.');
          const tarball = join(process.env.RUNNER_TEMP, packed.filename);
          const prefix = join(process.env.RUNNER_TEMP, 'foundation-cli-install');
          execFileSync('npm', ['install', '--global', '--offline', '--ignore-scripts', '--no-audit', '--no-fund', '--prefix', prefix, tarball], { stdio: 'inherit' });
          const actual = execFileSync(join(prefix, 'bin', 'foundation'), ['--version'], { encoding: 'utf8' }).trim();
          if (actual !== pkg.version) throw new Error('Installed package version mismatch.');
          appendFileSync(process.env.GITHUB_OUTPUT, 'tarball=' + tarball + '\n');
          console.log('Verified ' + packed.id + ' (' + packed.size + ' bytes).');
          NODE
      - name: Verify npm trusted publishing
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('cli/package.json', 'utf8'));
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'npm:registry.npmjs.org');
          const identity = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(30_000),
          });
          if (!identity.ok) throw new Error(`GitHub OIDC returned HTTP ${identity.status}.`);
          const { value } = await identity.json();
          if (!value) throw new Error('GitHub did not return an OIDC token.');
          const exchange = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(pkg.name)}`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${value}` },
            signal: AbortSignal.timeout(30_000),
          });
          if (!exchange.ok) throw new Error(`npm rejected this workflow (HTTP ${exchange.status}). Check the package's Trusted Publisher settings.`);
          const result = await exchange.json();
          if (!result.token) throw new Error('npm did not issue a registry token.');
          console.log(`npm accepted this workflow for ${pkg.name}. No package was published.`);
          NODE
      - name: Create the GitHub Release
        if: github.event_name == 'push' && steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/cli-release.mjs github
      - name: Publish through npm trusted publishing
        if: github.event_name != 'workflow_dispatch' && steps.release.outputs.publish == 'true'
        working-directory: cli
        env:
          CLI_TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$CLI_TARBALL" --access public --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Confirm npm publication
        if: github.event_name != 'workflow_dispatch' && steps.release.outputs.publish == 'true'
        run: node .github/scripts/cli-release.mjs wait
