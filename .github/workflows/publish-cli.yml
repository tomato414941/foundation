name: Publish Foundation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Release the tested commit, or retry publication of its deployed artifacts
        type: choice
        options: [release, publish-only]
        default: release
      allow_schema_change:
        description: Apply a reviewed database migration after creating a private backup
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'publish-only'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: foundation-ci-only
          POSTGRES_DB: foundation_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U foundation -d foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://foundation:foundation-ci-only@127.0.0.1:5432/foundation_test
      TEST_COMMAND_IMAGE: public.ecr.aws/docker/library/node@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
          npm ci --include=dev --no-audit --no-fund
      - name: Prepare the pinned command image
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull "$TEST_COMMAND_IMAGE"; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
      - name: Check and test
        run: |
          npm run check
          npm test
          python3 -m unittest discover -s deploy/release -p 'test_*.py'
          npm run build
      - name: Test browser workflows
        run: |
          python3 -m venv "$RUNNER_TEMP/foundation-ui"
          "$RUNNER_TEMP/foundation-ui/bin/pip" install playwright==1.58.0
          "$RUNNER_TEMP/foundation-ui/bin/python" -m playwright install --with-deps chromium webkit
          "$RUNNER_TEMP/foundation-ui/bin/python" tests/browser.py

  release:
    needs: test
    if: always() && (needs.test.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-only'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment:
      name: production
      url: https://foundationsystems.app
    concurrency:
      group: foundation-production-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
      FOUNDATION_BUCKET: foundation-objects-052438773980
      FOUNDATION_INSTANCE_ID: i-012a1a04ee760f433
      EC2_ENVIRONMENT_ZONE: ap-northeast-1a
      ENVIRONMENT_COMMAND_IMAGE: public.ecr.aws/docker/library/node@sha256:d8e448a56fc63242f70026718378bd4b00f8c82e78d20eefb199224a4d8e33d8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: arn:aws:iam::052438773980:role/foundation-github-release
          role-session-name: foundation-release-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 3600
      - name: Build and check the CLI distribution
        id: cli
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build:cli
          node .github/scripts/cli-release.mjs plan
      - name: Check npm trusted publishing before deployment
        if: steps.cli.outputs.publish == 'true'
        run: node .github/scripts/cli-release.mjs verify
      - name: Sign in to the container registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Prepare immutable release artifacts
        env:
          PUBLICATION_ONLY: ${{ inputs.mode == 'publish-only' }}
        run: |
          args=()
          if [ "$PUBLICATION_ONLY" = true ]; then args+=(--existing-only); fi
          python3 deploy/release/prepare.py "$RUNNER_TEMP/foundation-release" "${args[@]}"
      - name: Build and verify the final server container
        if: inputs.mode != 'publish-only'
        run: python3 deploy/release/build.py "$RUNNER_TEMP/foundation-release"
      - name: Deploy and verify production
        id: deploy
        if: inputs.mode != 'publish-only'
        env:
          ALLOW_SCHEMA_CHANGE: ${{ inputs.allow_schema_change == true }}
        run: |
          args=()
          if [ "$ALLOW_SCHEMA_CHANGE" = true ]; then args+=(--allow-schema-change); fi
          python3 deploy/release/deploy.py "$RUNNER_TEMP/foundation-release/manifest.json" "${args[@]}"
      - name: Confirm the exact deployed release
        if: steps.deploy.outputs.obsolete != 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/foundation-release/manifest.json', 'utf8'));
          const response = await fetch('https://foundationsystems.app/api/release', { signal: AbortSignal.timeout(30_000) });
          if (!response.ok) throw new Error('Production has no verified release.');
          const actual = await response.json();
          if (actual.commit !== expected.commit || actual.cliSha256 !== expected.cliSha256) throw new Error('Another commit is running in production.');
          console.log('Production verified: ' + actual.commit);
          NODE
      - name: Publish the verified CLI
        if: steps.cli.outputs.publish == 'true' && steps.deploy.outputs.obsolete != 'true'
        working-directory: cli
        run: npm publish "$RUNNER_TEMP/foundation-release/cli.tgz" --access public --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Confirm npm publication
        if: steps.cli.outputs.publish == 'true' && steps.deploy.outputs.obsolete != 'true'
        run: node .github/scripts/cli-release.mjs wait
      - name: Publish the GitHub Release
        if: steps.deploy.outputs.obsolete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/cli-release.mjs github
      - name: Record release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-release-${{ github.sha }}
          path: ${{ runner.temp }}/foundation-release/*.json
          if-no-files-found: ignore
