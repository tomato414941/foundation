AWSTemplateFormatVersion: '2010-09-09'
# The running host (stack foundation-host) was created from an earlier version of this template and then changed by hand:
# Caddy was installed and 80/443 opened; Tailscale was dropped. This template describes the host as it now is, for the
# next time one is created. Applying it to the running stack would replace the instance, and its database with it.
Description: "A host for Foundation - one small Arm instance in its own network, a KMS key that wraps the data key, a private bucket for backups, and an instance role limited to those (and to the file space, when given). Caddy terminates TLS for the public host and hands requests to the service on localhost; only 80 and 443 are open. Administered through SSM, never SSH keys. The key and the backups outlive the stack."
Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 (arm64), resolved to the current image at stack creation.
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues: [t4g.nano, t4g.micro, t4g.small]
  Repository:
    Type: String
    Default: https://github.com/tomato414941/foundation.git
    Description: Where the Foundation code is cloned from.
  FilesBucket:
    Type: String
    Default: ''
    Description: An existing bucket for the file space (empty for none). The host may create and read objects under files/ only.
  PublicHost:
    Type: String
    Default: 54.249.17.233.sslip.io
    Description: The host name the service is published under. Caddy obtains its certificate for this name, so it must resolve to the instance's address.
  ClientHost:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
    Description: Optional OAuth client website. Serves the Foundation logo and redirects to PublicHost.
  AcmeEmail:
    Type: String
    Default: tomato414941@gmail.com
    Description: Where the certificate authority sends notices about the certificate.
Conditions:
  HasFiles: !Not [!Equals [!Ref FilesBucket, '']]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: foundation }]
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: foundation }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Foundation host - no inbound traffic. Tailscale and SSM connect outward.
      # The description above is what the running group was created with; changing it would replace the group.
      # What is true now: only 80 and 443 are open, for Caddy. SSM connects outward; nothing else listens.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: foundation }]
  # Deleting the key would make every credential and every backup unreadable, so it is never deleted with the stack.
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Wraps the key that seals every credential Foundation stores.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/foundation
      TargetKeyId: !Ref DataKey
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt DataKey.Arn }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-old-backups, Status: Enabled, ExpirationInDays: 90, NoncurrentVersionExpiration: { NoncurrentDays: 30 } }
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: What the Foundation host itself may do - use its KMS key, write its backups, and be managed through SSM.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: foundation-host
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:DescribeKey, kms:GenerateDataKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*']
              - !If
                - HasFiles
                - Effect: Allow
                  Action: [s3:PutObject, s3:GetObject]
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${FilesBucket}/files/*'
                - !Ref AWS::NoValue
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: foundation }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/foundation-bootstrap.log) 2>&1
          dnf -y update
          dnf -y install git sqlite tar dnf-automatic
          sed -i 's/^upgrade_type.*/upgrade_type = security/; s/^apply_updates.*/apply_updates = yes/' /etc/dnf/automatic.conf
          systemctl enable --now dnf-automatic.timer
          curl -fsSL https://rpm.nodesource.com/setup_24.x | bash -
          dnf -y install nodejs
          # Caddy: TLS for the public host, handed to the service on localhost. Installed from the official binary.
          curl -fsSL "https://caddyserver.com/api/download?os=linux&arch=arm64" -o /usr/local/bin/caddy && chmod 755 /usr/local/bin/caddy
          useradd --system --home /var/lib/caddy --shell /sbin/nologin caddy || true
          mkdir -p /etc/caddy /var/lib/caddy && chown caddy:caddy /var/lib/caddy
          cat > /etc/caddy/Caddyfile <<CADDY
          {
          	email ${AcmeEmail}
          }

          ${PublicHost} {
          	encode zstd gzip
          	reverse_proxy 127.0.0.1:3417
          }
          CADDY
          if [ -n "${ClientHost}" ]; then
            cat >> /etc/caddy/Caddyfile <<CLIENT

          ${ClientHost} {
            encode zstd gzip
            handle /logo.svg {
              root * /opt/foundation/app/web
              file_server
            }
            handle {
              redir https://${PublicHost}{uri} 302
            }
          }
          CLIENT
          fi
          cat > /etc/systemd/system/caddy.service <<'UNIT'
          [Unit]
          Description=Caddy
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=caddy
          Group=caddy
          ExecStart=/usr/local/bin/caddy run --environ --config /etc/caddy/Caddyfile
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          useradd --system --home /opt/foundation --shell /sbin/nologin foundation || true
          mkdir -p /opt/foundation /var/lib/foundation /etc/foundation
          git clone --depth 1 ${Repository} /opt/foundation/app
          (cd /opt/foundation/app && npm ci --omit=dev)
          cat > /etc/foundation/env <<'ENV'
          FOUNDATION_DATA_DIR=/var/lib/foundation
          FOUNDATION_PORT=3417
          FOUNDATION_BIND=127.0.0.1
          ENV
          echo "FOUNDATION_KMS_KEY_ID=${DataKey.Arn}" >> /etc/foundation/env
          echo "FOUNDATION_AWS_REGION=${AWS::Region}" >> /etc/foundation/env
          echo "FOUNDATION_BACKUP_BUCKET=${BackupBucket}" >> /etc/foundation/env
          echo "FOUNDATION_PUBLIC_ORIGIN=https://${PublicHost}" >> /etc/foundation/env
          echo "FOUNDATION_TRUSTED_PROXIES=127.0.0.1" >> /etc/foundation/env
          if [ -n "${FilesBucket}" ]; then echo "FOUNDATION_FILES_BUCKET=${FilesBucket}" >> /etc/foundation/env; echo "FOUNDATION_FILES_REGION=${AWS::Region}" >> /etc/foundation/env; fi
          chown -R foundation:foundation /opt/foundation /var/lib/foundation /etc/foundation
          chmod 700 /var/lib/foundation && chmod 600 /etc/foundation/env
          cat > /etc/systemd/system/foundation.service <<'UNIT'
          [Unit]
          Description=Foundation
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=foundation
          Group=foundation
          WorkingDirectory=/opt/foundation/app
          EnvironmentFile=/etc/foundation/env
          ExecStart=/usr/bin/node src/server.mjs
          Restart=always
          RestartSec=3
          LimitCORE=0
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/var/lib/foundation
          [Install]
          WantedBy=multi-user.target
          UNIT
          cat > /usr/local/bin/foundation-backup <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          . /etc/foundation/env
          tmp=$(mktemp) && sqlite3 /var/lib/foundation/state.sqlite ".backup $tmp"
          aws s3 cp "$tmp" "s3://$FOUNDATION_BACKUP_BUCKET/state-$(date -u +%Y%m%dT%H%M%SZ).sqlite" --only-show-errors
          rm -f "$tmp"
          # The host's configuration too, so a rebuilt host can be given the same settings. The bucket is private and
          # encrypted with the same KMS key that seals the database.
          aws s3 cp /etc/foundation/env "s3://$FOUNDATION_BACKUP_BUCKET/host-env" --only-show-errors
          SCRIPT
          chmod 755 /usr/local/bin/foundation-backup
          cat > /etc/systemd/system/foundation-backup.service <<'UNIT'
          [Unit]
          Description=Foundation database backup to S3
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/foundation-backup
          UNIT
          cat > /etc/systemd/system/foundation-backup.timer <<'UNIT'
          [Unit]
          Description=Daily Foundation backup
          [Timer]
          OnCalendar=daily
          RandomizedDelaySec=1h
          Persistent=true
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now caddy foundation foundation-backup.timer
          echo "bootstrap complete"
  Address:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Name, Value: foundation }]
Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !Ref Address
  KmsKeyArn:
    Value: !GetAtt DataKey.Arn
  BackupBucket:
    Value: !Ref BackupBucket
