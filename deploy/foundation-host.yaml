AWSTemplateFormatVersion: '2010-09-09'
Description: Foundation application and PostgreSQL on an Arm EC2 host with HTTPS, SSM access, KMS encryption and daily database backups.
Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 (arm64), resolved to the current image at stack creation.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t4g.large]
  Repository:
    Type: String
    Default: https://github.com/tomato414941/foundation.git
    Description: Where the Foundation code is cloned from.
  Revision:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
    Description: Git branch or tag to build.
  ObjectsBucket:
    Type: String
    Default: ''
    Description: An existing bucket for objects (empty for none). The host may list it and create, read and delete its objects.
  PublicHost:
    Type: String
    Default: foundationsystems.app
    Description: The host name the service is published under. Caddy obtains its certificate for this name, so it must resolve to the instance's address.
  ClientHost:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
    Description: Optional OAuth client website. Serves the Foundation logo and redirects to PublicHost.
  AcmeEmail:
    Type: String
    Default: tomato414941@gmail.com
    Description: Where the certificate authority sends notices about the certificate.
Conditions:
  HasObjects: !Not [!Equals [!Ref ObjectsBucket, '']]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: foundation }]
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: foundation }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Foundation HTTPS and HTTP certificate validation.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: foundation }]
  # Deleting the key would make every credential and every backup unreadable, so it is never deleted with the stack.
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Wraps the key that seals every credential Foundation stores.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/foundation
      TargetKeyId: !Ref DataKey
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt DataKey.Arn }
      PublicAccessBlockConfiguration:
        {
          BlockPublicAcls: true,
          BlockPublicPolicy: true,
          IgnorePublicAcls: true,
          RestrictPublicBuckets: true,
        }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - {
              Id: expire-old-backups,
              Status: Enabled,
              ExpirationInDays: 30,
              NoncurrentVersionExpiration: { NoncurrentDays: 30 },
            }
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: What the Foundation host itself may do - use its KMS key, write its backups, and be managed through SSM.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: foundation-host
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:DescribeKey, kms:GenerateDataKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt BackupBucket.Arn, !Sub '${BackupBucket.Arn}/*']
              # Account holders connect AWS by making a role that trusts this one (deploy/aws-connection.yaml).
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: '*'
                Condition:
                  StringLike: { 'sts:ExternalId': '?*' }
              - !If
                - HasObjects
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${ObjectsBucket}'
                - !Ref AWS::NoValue
              - !If
                - HasObjects
                - Effect: Allow
                  Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${ObjectsBucket}/*'
                - !Ref AWS::NoValue
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 2 }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: false }
      Tags: [{ Key: Name, Value: foundation }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/foundation-bootstrap.log) 2>&1
          dnf -y update
          dnf -y install git docker openssl dnf-automatic
          systemctl enable --now docker
          sed -i 's/^upgrade_type.*/upgrade_type = security/; s/^apply_updates.*/apply_updates = yes/' /etc/dnf/automatic.conf
          systemctl enable --now dnf-automatic.timer
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fSL https://github.com/docker/compose/releases/download/v5.1.0/docker-compose-linux-aarch64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          curl -fSL https://github.com/docker/buildx/releases/download/v0.37.2/buildx-v0.37.2.linux-arm64 -o /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod 755 /usr/local/lib/docker/cli-plugins/*
          mkdir -p /opt/foundation
          git clone --depth 1 --branch '${Revision}' '${Repository}' /opt/foundation/app
          cd /opt/foundation/app
          umask 077
          cat > .env <<'ENV'
          FOUNDATION_ORIGIN=https://${PublicHost}
          FOUNDATION_KMS_KEY=${DataKey.Arn}
          FOUNDATION_AWS_PRINCIPAL_ARN=${InstanceRole.Arn}
          AWS_REGION=${AWS::Region}
          FOUNDATION_BUCKET=${ObjectsBucket}
          ENV
          echo "FOUNDATION_DATABASE_PASSWORD=$(openssl rand -hex 32)" >> .env
          docker compose --project-name foundation build
          cat > /etc/systemd/system/foundation.service <<'UNIT'
          [Unit]
          Description=Foundation application and PostgreSQL
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/foundation/app
          ExecStart=/usr/bin/docker compose --project-name foundation up -d --wait --wait-timeout 120
          ExecStop=/usr/bin/docker compose --project-name foundation stop
          TimeoutStartSec=180
          TimeoutStopSec=120
          [Install]
          WantedBy=multi-user.target
          UNIT
          curl -fsSL 'https://caddyserver.com/api/download?os=linux&arch=arm64' -o /usr/local/bin/caddy
          chmod 755 /usr/local/bin/caddy
          useradd --system --home /var/lib/caddy --shell /sbin/nologin caddy || true
          mkdir -p /etc/caddy /var/lib/caddy
          chown caddy:caddy /var/lib/caddy
          cat > /etc/caddy/Caddyfile <<CADDY
          {
            email ${AcmeEmail}
          }
          ${PublicHost} {
            encode zstd gzip
            reverse_proxy 127.0.0.1:3417
          }
          CADDY
          if [ -n '${ClientHost}' ]; then
            cat >> /etc/caddy/Caddyfile <<CLIENT
          ${ClientHost} {
            handle /logo.svg {
              root * /opt/foundation/app/web/public
              file_server
            }
            handle {
              redir https://${PublicHost}{uri} 302
            }
          }
          CLIENT
          fi
          chmod 644 /etc/caddy/Caddyfile
          cat > /etc/systemd/system/caddy.service <<'UNIT'
          [Unit]
          Description=Caddy
          After=network-online.target foundation.service
          Wants=network-online.target
          [Service]
          User=caddy
          Group=caddy
          ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          Restart=always
          [Install]
          WantedBy=multi-user.target
          UNIT
          cat > /usr/local/bin/foundation-backup <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          umask 077
          cd /opt/foundation/app
          backup=$(mktemp)
          trap 'rm -f "$backup"' EXIT
          docker compose --project-name foundation exec -T postgres pg_dump -U foundation -d foundation --format=custom > "$backup"
          aws s3 cp "$backup" 's3://${BackupBucket}/database-'"$(date -u +%Y%m%dT%H%M%SZ)"'.dump' --only-show-errors
          aws s3 cp .env 's3://${BackupBucket}/host-env' --only-show-errors
          SCRIPT
          chmod 755 /usr/local/bin/foundation-backup
          cat > /etc/systemd/system/foundation-backup.service <<'UNIT'
          [Unit]
          Description=Foundation PostgreSQL backup to S3
          Requires=foundation.service
          After=foundation.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/foundation-backup
          UNIT
          cat > /etc/systemd/system/foundation-backup.timer <<'UNIT'
          [Unit]
          Description=Daily Foundation backup
          [Timer]
          OnCalendar=daily
          RandomizedDelaySec=1h
          Persistent=true
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now foundation caddy foundation-backup.timer
  Address:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{ Key: Name, Value: foundation }]
Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !Ref Address
  KmsKeyArn:
    Value: !GetAtt DataKey.Arn
  BackupBucket:
    Value: !Ref BackupBucket
